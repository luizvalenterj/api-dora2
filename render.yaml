services:
  - type: web
    name: health-network-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # NODE_ENV=production faz o servidor escutar em 0.0.0.0, como o Render
      # exige. Localmente o padrao e 127.0.0.1.
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: ALGOLIA_TIMEOUT_MS
        value: "8000"
      # Secrets NAO ficam versionados: definir no dashboard do Render.
      - key: ALGOLIA_APP_ID
        sync: false
      - key: ALGOLIA_SEARCH_API_KEY
        sync: false
      # Nome do indice nao e secret.
      - key: ALGOLIA_INDEX_NAME
        value: cobertura_convenios_planos
      - key: API_ACCESS_KEY
        sync: false
